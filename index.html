<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازی قلعه‌ها</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#16202a;color:#f3f5f7}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:#2f7dce;color:#fff}.danger{background:#8e3b3b}.back{background:#59636f}.screen{display:none;min-height:100vh;padding:16px}.screen#development{background:linear-gradient(rgba(10,15,20,.45),rgba(10,15,20,.65)),url('/images/development/development-background.jpg') center/cover fixed no-repeat}.screen.active{display:block}.wrap{max-width:1100px;margin:auto}.card{background:#222d38;border:1px solid #3a4652;border-radius:13px;padding:16px;margin-bottom:14px}.actions{display:flex;flex-wrap:wrap;gap:9px}.login{max-width:420px;margin:8vh auto}.login input{width:100%;padding:12px;margin:6px 0;background:#111820;border:1px solid #4a5662;color:#fff;border-radius:8px}.topline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#111a22;border-radius:9px;padding:12px;text-align:center}.buildings{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.building{background:#1a252e;border:1px solid #46525e;border-radius:12px;padding:8px;text-align:center;cursor:pointer}.building img{width:100%;height:135px;object-fit:contain}.level{font-weight:800}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:650px;margin:16px auto}.map-cell{aspect-ratio:1;background:#2a3944;border:1px solid #56636e;border-radius:7px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;min-height:80px}.map-cell.empty{cursor:default}.map-cell.me{box-shadow:inset 0 0 0 3px #48a7ff}.map-cell .castle{font-size:34px}.map-cell small{position:absolute;left:5px;top:3px;font-size:10px;opacity:.65}.map-cell .name{font-size:11px;position:absolute;bottom:4px;white-space:nowrap;overflow:hidden;max-width:95%}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#202b35;border:1px solid #52606d;border-radius:14px;padding:18px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{background:#151f27;border-radius:9px;padding:10px;border:1px solid #3f4d59}.slot select,.slot input{width:100%;padding:8px;background:#0d151c;color:#fff;border:1px solid #4a5662;border-radius:7px;margin-top:5px}.timer{font-size:31px;font-weight:900;text-align:center;background:#111820;border-radius:10px;padding:14px;margin:12px 0;color:#ffd45a}.notice{background:#273847;border-radius:9px;padding:10px;margin:8px 0}.battle-page{padding:0;background:#111}.battle-page .battle-bg{position:fixed;inset:0;background:url('/images/zamine.png') center/100% 100% no-repeat;z-index:0}.battle-ui{position:relative;z-index:1;min-height:100vh}.battle-grid{position:absolute;inset:4% 0 4%;display:flex;flex-direction:column;align-items:center}.battle-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));width:var(--w);height:5%;flex:none}.battle-cell{border:1px solid rgba(40,50,30,.2);display:flex;align-items:center;justify-content:center;position:relative;color:#111}.battle-cell.attacker{background:rgba(70,140,255,.14)}.battle-cell.defender{background:rgba(255,80,80,.14)}.battle-unit{width:100%;height:100%;padding:0;background:transparent;color:#111;position:relative}.battle-unit img{width:100%;height:100%;object-fit:contain}.unit-no,.unit-count,.unit-castle{position:absolute;background:rgba(255,255,255,.88);border-radius:4px;padding:1px 4px;font-size:9px;font-weight:900;z-index:2}.unit-no{top:1px;right:1px}.unit-castle{top:1px;left:1px}.unit-count{bottom:1px;left:50%;transform:translateX(-50%)}.battle-top{position:absolute;top:12px;right:12px;left:12px;display:flex;justify-content:space-between;z-index:3}.battle-top .box{background:rgba(20,28,35,.78);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:8px 12px}.battle-bottom{position:absolute;bottom:10px;right:10px;z-index:3}.table-wrap{overflow:auto}.battle-table{border-collapse:collapse;width:100%}.battle-table th,.battle-table td{border:1px solid #46525e;padding:7px;text-align:center}.battle-table th{background:#111820}.hidden{display:none!important}@media(max-width:700px){.topline{grid-template-columns:repeat(2,1fr)}.buildings{grid-template-columns:repeat(2,1fr)}.slots{grid-template-columns:1fr}.map-cell{min-height:58px}.building img{height:105px}}
</style>
</head>
<body>
<section id="login" class="screen active"><div class="login card"><h1>🏰 بازی قلعه‌ها</h1><p>ورود یا ثبت‌نام</p><input id="username" placeholder="نام کاربری"><input id="password" type="password" placeholder="رمز عبور"><div class="actions"><button onclick="login(false)">ورود</button><button onclick="login(true)">ثبت‌نام</button></div><div id="loginMsg" class="notice"></div></div></section>

<section id="development" class="screen"><div class="wrap"><div class="card"><div class="topline"><div class="stat">🏹 کماندار<br><b id="archer">0</b></div><div class="stat">⚔️ شمشیرزن<br><b id="swordsman">0</b></div><div class="stat">🐎 سوارکار<br><b id="cavalry">0</b></div><div class="stat">🪙 طلا<br><b id="gold">0</b><br><small id="goldProd"></small></div></div></div><div class="card"><h2 id="castleTitle"></h2><div id="attackTimer" class="timer hidden"></div><div id="devMsg" class="notice"></div></div><div class="card"><h3>ساختمان‌های قلعه</h3><div class="buildings"><div class="building" onclick="openBuilding('castle')"><img src="/images/development/development-castle.png"><div>ساختمان اصلی</div><div>سطح <b id="bcastle">1</b></div></div><div class="building" onclick="openBuilding('barracks1')"><img src="/images/development/development-barracks1.png"><div>سربازخانه ۱</div><div>سطح <b id="bb1">1</b></div></div><div class="building" onclick="openBuilding('barracks2')"><img src="/images/development/development-barracks2.png"><div>سربازخانه ۲</div><div>سطح <b id="bb2">1</b></div></div><div class="building" onclick="openBuilding('goldMine')"><img src="/images/development/development-goldMine.png"><div>معدن طلا</div><div>سطح <b id="bmine">1</b></div></div><div class="building" onclick="openBuilding('wall')"><img src="/images/development/development-wall.png"><div>دیوار</div><div>سطح <b id="bwall">1</b></div></div></div></div><div class="card"><div class="actions"><button onclick="showMap()">🗺️ نقشه بازیکنان</button><button onclick="showBattle()">⚔️ صحنه نبرد</button><button class="danger" onclick="logout()">خروج</button></div></div></div></section>

<section id="map" class="screen"><div class="wrap"><div class="card"><h2>🗺️ نقشه بازیکنان</h2><div id="mapInfo" class="notice"></div><div id="playerMap" class="map"></div><div class="actions"><button onclick="showBattle()">⚔️ صحنه نبرد</button><button class="back" onclick="showDevelopment()">صفحه توسعه</button></div></div></div></section>

<section id="battle" class="screen battle-page"><div class="battle-bg"></div><div class="battle-ui"><div id="battleGrid" class="battle-grid"></div><div class="battle-top"><div class="box" id="battleTitle">صحنه نبرد</div><div class="box"><button class="back" onclick="showDevelopment()">توسعه</button> <button onclick="showMap()">نقشه</button></div></div><div class="battle-bottom"><button class="danger" onclick="showDevelopment()">خروج</button></div></div></section>

<div id="playerModal" class="modal"><div class="modalbox"><h2 id="targetTitle"></h2><div class="actions"><button onclick="openAttack()">⚔️ حمله</button><button onclick="openDefense()">🛡️ دفاع</button><button class="back" onclick="closeModal()">بستن</button></div><div id="modalContent"></div></div></div>

<div id="buildingModal" class="modal"><div class="modalbox"><h2 id="buildingTitle"></h2><div class="actions"><button>ارتقا</button><button>نیروسازی</button><button class="back" onclick="document.getElementById('buildingModal').classList.remove('open')">بستن</button></div><div class="notice">جزئیات هزینه و زمان این بخش را بعداً طبق قوانین بازی اضافه می‌کنیم.</div></div></div>

<script>
const API='/api';let token=sessionStorage.getItem('castle_game_token')||'';let me=null;let players=[];let target=null;let attackSlots=[];let countdownTimer=null;let currentBattle=null;
const unitNames={archer:'کماندار',swordsman:'شمشیرزن',cavalry:'سوارکار'};
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;const c=new AbortController();const t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(API+path,{...opt,headers:h,signal:c.signal,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'خطای سرور');return d}catch(e){if(e.name==='AbortError')throw new Error('اتصال به سرور بیش از ۱۵ ثانیه طول کشید.');throw e}finally{clearTimeout(t)}}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.body.classList.toggle('battle-page',id==='battle')}
async function login(register){const msg=document.getElementById('loginMsg');try{msg.textContent='در حال اتصال...';const d=await api(register?'/register':'/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});token=d.token;sessionStorage.setItem('castle_game_token',token);me=d.user;await refreshMe();showDevelopment()}catch(e){msg.textContent=e.message}}
async function refreshMe(){const d=await api('/me');me=d.user;renderDev();await checkExpiredAttacks()}
function renderDev(){const s=me.state;document.getElementById('castleTitle').textContent=`قلعه ${me.castleId} — آدرس ${me.castleAddress}`;archer.textContent=s.army.archer;swordsman.textContent=s.army.swordsman;cavalry.textContent=s.army.cavalry;gold.textContent=Math.floor(s.gold);goldProd.textContent=`تولید ${Math.round(100*Math.pow(1.1,s.buildings.goldMine.level-1))} طلا/دقیقه`;bcastle.textContent=s.buildings.castle.level;bb1.textContent=s.buildings.barracks1.level;bb2.textContent=s.buildings.barracks2.level;bmine.textContent=s.buildings.goldMine.level;bwall.textContent=s.buildings.wall.level;renderTimer()}
function showDevelopment(){screen('development');renderDev()}
async function showMap(){screen('map');await loadPlayers()}
async function loadPlayers(){try{const d=await api('/players');players=d.players;renderMap(d.spiral)}catch(e){mapInfo.textContent=e.message}}
function renderMap(spiral){const el=document.getElementById('playerMap');el.innerHTML='';const max=Math.max(25,spiral.length);const pts=spiral.slice(0,max);const minX=Math.min(-2,...pts.map(c=>c.x)),maxX=Math.max(2,...pts.map(c=>c.x)),minY=Math.min(-2,...pts.map(c=>c.y)),maxY=Math.max(2,...pts.map(c=>c.y));const cells=[];for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++)cells.push({x,y});const cellByCoord=new Map(spiral.map((c,i)=>[`${c.x},${c.y}`,i]));for(const c of cells){const div=document.createElement('div');div.className='map-cell empty';const idx=cellByCoord.get(`${c.x},${c.y}`);if(idx===undefined){div.innerHTML='<small>خالی</small>';el.appendChild(div);continue}const p=players.find(x=>Number(x.cellIndex)===idx);div.innerHTML=`<small>${idx}</small>`;if(p){div.className='map-cell '+(p.id===me.id?'me':'');div.innerHTML+=`<div class="castle">🏰</div><div class="name">قلعه ${p.castleId}<br>${p.username}</div>`;div.onclick=()=>openPlayer(p)}else div.innerHTML+='<small>خانه آزاد</small>';el.appendChild(div)}document.getElementById('mapInfo').textContent=`قلعه شما: ${me.castleId} | آدرس: ${me.castleAddress} | تعداد بازیکنان: ${players.length}`}
function openPlayer(p){target=p;document.getElementById('targetTitle').textContent=`قلعه ${p.castleId} — ${p.username}`;document.getElementById('modalContent').innerHTML='<div class="notice">حمله یا دفاع را انتخاب کنید.</div>';document.getElementById('playerModal').classList.add('open')}
function closeModal(){document.getElementById('playerModal').classList.remove('open')}
function slotHTML(i,available){return `<div class="slot"><b>لاین ${i+1}</b><select id="type${i}"><option value="archer">کماندار</option><option value="swordsman">شمشیرزن</option><option value="cavalry">سوارکار</option></select><input id="count${i}" type="number" min="0" max="${available}" value="0"></div>`}
function openAttack(){if(!target||target.id===me.id){document.getElementById('modalContent').innerHTML='<div class="notice">این قلعه هدف حمله نیست.</div>';return}document.getElementById('modalContent').innerHTML=`<div class="notice">۶ لاین نیرو را انتخاب کنید. زمان حرکت بر اساس فاصله قلعه‌ها محاسبه می‌شود.</div><div class="slots">${Array.from({length:6},(_,i)=>slotHTML(i,100)).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="moveTroops()">حرکت نیروها</button><button class="back" onclick="closeModal()">لغو</button></div>`}
function openDefense(){const slots=me.state.defenderSetups?.self?.slots||[];document.getElementById('modalContent').innerHTML=`<div class="notice">این ۶ لاین چینش دفاعی ثابت قلعه شماست.</div><div class="slots">${Array.from({length:6},(_,i)=>`<div class="slot"><b>لاین ${i+1}</b><select id="dtype${i}"><option value="archer">کماندار</option><option value="swordsman">شمشیرزن</option><option value="cavalry">سوارکار</option></select><input id="dcount${i}" type="number" min="0" value="${slots[i]?.count||0}"></div>`).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="saveDefense()">ذخیره دفاع</button></div>`;slots.forEach((s,i)=>{const x=document.getElementById('dtype'+i);if(x)x.value=s.type||'archer'})}
async function saveDefense(){const slots=Array.from({length:6},(_,i)=>({type:document.getElementById('dtype'+i).value,count:Number(document.getElementById('dcount'+i).value)||0}));try{const d=await api('/defense',{method:'PUT',body:JSON.stringify({slots})});me.state.defenderSetups=d.setup;document.getElementById('modalContent').innerHTML='<div class="notice">چینش دفاعی ذخیره شد.</div>'}catch(e){alert(e.message)}}
async function moveTroops(){const slots=Array.from({length:6},(_,i)=>({type:document.getElementById('type'+i).value,count:Number(document.getElementById('count'+i).value)||0}));try{const d=await api('/attack',{method:'POST',body:JSON.stringify({targetId:target.id,slots})});me.state=d.state;closeModal();renderDev();startAttackTimer(d.attack)}catch(e){alert(e.message)}}
function startAttackTimer(a){clearInterval(countdownTimer);me.state.activeAttacks=me.state.activeAttacks||[];const el=document.getElementById('attackTimer');function tick(){const remain=Math.max(0,Math.ceil((Number(a.arrivalAt)-Date.now())/1000));el.classList.remove('hidden');el.textContent=`⏱ رسیدن نیروها: ${fmt(remain)}`;if(remain<=0){clearInterval(countdownTimer);batman(a)}}tick();countdownTimer=setInterval(tick,500)}
function renderTimer(){const a=(me.state.activeAttacks||[]).find(x=>!x.battleTriggered&&Number(x.arrivalAt)>Date.now());if(a)startAttackTimer(a);else document.getElementById('attackTimer').classList.add('hidden')}
function fmt(s){s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
async function checkExpiredAttacks(){for(const a of (me.state.activeAttacks||[])){if(!a.battleTriggered&&Number(a.arrivalAt)<=Date.now()){await batman(a);return}}renderTimer()}
async function batman(attack){document.getElementById('devMsg').textContent='batman اجرا شد؛ نیروها وارد نبرد شدند.';document.getElementById('attackTimer').classList.add('hidden');try{const d=await api('/batman',{method:'POST',body:JSON.stringify({attackId:attack.id})});if(d.battle){currentBattle=d.battle;showBattle(d.battle)}}catch(e){document.getElementById('devMsg').textContent=e.message}}
async function showBattle(battleArg){screen('battle');try{const b=battleArg||((await api('/battle/current?targetId='+encodeURIComponent(me.castleId))).battle);currentBattle=b;renderBattle(b)}catch(e){document.getElementById('battleTitle').textContent=e.message}}
function renderBattle(b){const grid=document.getElementById('battleGrid');grid.innerHTML='';if(!b){document.getElementById('battleTitle').textContent='صحنه نبرد — نبردی وجود ندارد';return}document.getElementById('battleTitle').textContent=`نبرد قلعه ${b.target_id||b.targetId} — batman`;const units=(b.armies||[]).flatMap(a=>(a.units||[]).map(u=>({...u,castleId:a.castleId,side:a.side})));const byCell=new Map();for(const u of units){if(u.x&&u.y)byCell.set(String.fromCharCode(64+u.y)+u.x,u)}for(let y=1;y<=20;y++){const w=(55.2+((y-1)/19)*36.8).toFixed(3);const row=document.createElement('div');row.className='battle-row';row.style.setProperty('--w',w+'%');for(let x=1;x<=12;x++){const cell=document.createElement('div');const key=String.fromCharCode(64+y)+x;const u=byCell.get(key);cell.className='battle-cell '+(u?(u.side==='مهاجم'?'attacker':'defender'):'');if(u){const btn=document.createElement('button');btn.className='battle-unit';const side=u.side==='مهاجم'?1:2;const img=document.createElement('img');img.src=`/images/${u.type==='archer'?'archer':u.type==='cavalry'?'cavalry':'swordsman'}${side}.png`;img.onerror=()=>img.style.display='none';btn.appendChild(img);btn.innerHTML+=`<span class="unit-no">${u.unitId||''}</span><span class="unit-castle">${u.castleId}</span><span class="unit-count">${u.count}</span>`;cell.appendChild(btn)}row.appendChild(cell)}grid.appendChild(row)}}
function openBuilding(type){const names={castle:'ساختمان اصلی',wall:'دیوار',barracks1:'سربازخانه ۱',barracks2:'سربازخانه ۲',goldMine:'معدن طلا'};document.getElementById('buildingTitle').textContent=names[type];document.getElementById('buildingModal').classList.add('open')}
function logout(){sessionStorage.removeItem('castle_game_token');token='';me=null;screen('login')}
(async function(){if(token){try{await refreshMe();showDevelopment()}catch{logout()}}})();
</script>
</body></html>
