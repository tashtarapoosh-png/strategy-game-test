<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازی استراتژیک</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Tahoma,Arial}.top{padding:10px;background:#1d1d1d;display:flex;justify-content:space-between;gap:8px}.wrap{max-width:1000px;margin:auto;padding:12px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:12px;padding:12px;margin-bottom:12px}.hidden{display:none!important}.btn{background:#292929;color:#fff;border:1px solid #777;border-radius:8px;padding:9px 12px;cursor:pointer}.input{background:#101010;color:#fff;border:1px solid #555;border-radius:8px;padding:9px;width:100%;margin:5px 0}.map{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.cell{height:75px;background:#252a24;border:1px solid #343a33;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.cell img{width:52px;height:52px;object-fit:contain}.me{outline:2px solid #ffd54a}.other{outline:1px solid #65a3ff}.name{position:absolute;bottom:2px;background:#000b;font-size:10px;padding:2px 4px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}.box{width:min(500px,100%);background:#1b1b1b;border:1px solid #666;border-radius:12px;padding:15px}.unit{display:grid;grid-template-columns:55px 1fr 90px;align-items:center;gap:8px;border:1px solid #444;border-radius:8px;padding:7px;margin:6px 0}.unit img{width:45px;height:45px}.timer{padding:9px;text-align:center;border:1px solid #ffd54a;border-radius:8px;color:#ffd54a;background:#121212;font-weight:bold;margin-bottom:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#aaa}</style></head><body>
<div id="auth" class="wrap panel" style="max-width:400px;margin-top:60px"><h2>ورود / ثبت‌نام</h2><input id="name" class="input" placeholder="نام کاربری"><input id="pass" class="input" type="password" placeholder="رمز عبور"><div class="row"><button class="btn" onclick="reg()">ثبت‌نام</button><button class="btn" onclick="login()">ورود</button></div><div id="msg" class="small"></div></div>
<div id="game" class="hidden"><div class="top"><b id="info"></b><div class="row"><button class="btn" onclick="view('world')">🗺 نقشه بازیکنان</button><button class="btn" onclick="view('dev')">🏰 توسعه قلعه</button></div></div><div class="wrap"><div id="world" class="panel"><h3>نقشه بازیکنان</h3><div id="map" class="map"></div></div><div id="dev" class="panel hidden"><h3>توسعه قلعه</h3><div id="timer" class="timer hidden"></div><img src="images/castle.png" style="width:75px"><div id="devInfo"></div><hr><div id="army"></div></div></div></div>
<div id="targetModal" class="modal hidden"><div class="box"><h3 id="targetTitle"></h3><div id="targetInfo" class="small"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="units('attack')">⚔️ حمله</button><button class="btn" onclick="units('defense')">🛡️ دفاع</button><button class="btn" onclick="closeM()">بستن</button></div></div></div>
<div id="unitsModal" class="modal hidden"><div class="box"><h3 id="unitsTitle"></h3><div id="unitList"></div><div class="row"><button class="btn" onclick="send()">تأیید و حرکت</button><button class="btn" onclick="closeM()">لغو</button></div><div id="unitMsg" class="small"></div></div></div>
<script>let token='',me,target,mode,battles=[];const types=['swordsman','archer','cavalry'],labels={swordsman:'شمشیرزن',archer:'کماندار',cavalry:'سواره‌نظام'},pics={swordsman:'swordsman1.png',archer:'archer1.png',cavalry:'cavalry1.png'};
async function api(p,o={}){o.headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}function done(d){token=d.token;me=d.user;localStorage.freshGame=token;auth.classList.add('hidden');game.classList.remove('hidden');refresh()}async function reg(){try{const n=document.getElementById('name'),p=document.getElementById('pass');done(await api('/api/register',{method:'POST',body:JSON.stringify({name:n.value,password:p.value})}))}catch(e){document.getElementById('msg').textContent=e.message}}async function login(){try{const n=document.getElementById('name'),p=document.getElementById('pass');done(await api('/api/login',{method:'POST',body:JSON.stringify({name:n.value,password:p.value})}))}catch(e){document.getElementById('msg').textContent=e.message}}
function view(x){world.classList.toggle('hidden',x!=='world');dev.classList.toggle('hidden',x!=='dev');if(x==='dev')refresh()}function closeM(){targetModal.classList.add('hidden');unitsModal.classList.add('hidden')}function distance(a,b){let ax=a%10,ay=Math.floor(a/10),bx=b%10,by=Math.floor(b/10);return Math.hypot(ax-bx,ay-by)}function selectTarget(p){target=p;targetTitle.textContent='قلعه '+p.name;targetInfo.textContent='فاصله: '+distance(me.cell,p.cell).toFixed(1)+' خانه';targetModal.classList.remove('hidden')}
function units(m){mode=m;targetModal.classList.add('hidden');unitsTitle.textContent=(m==='attack'?'⚔️ حمله به ':'🛡️ اعزام دفاع به ')+target.name;unitList.innerHTML=types.map(t=>`<div class="unit"><img src="images/${pics[t]}"><div>${labels[t]}<div class="small">موجودی: ${me.army[t]}</div></div><input id="n_${t}" class="input" type="number" min="0" max="${me.army[t]}" value="0"></div>`).join('');unitsModal.classList.remove('hidden')}
async function send(){let rows=types.map(t=>({type:t,count:Number(document.getElementById('n_'+t).value)||0})).filter(x=>x.count>0);if(!rows.length){unitMsg.textContent='نیرو انتخاب کن';return}try{let d=await api('/api/'+mode,{method:'POST',body:JSON.stringify({targetId:target.id,units:rows})});me=d.user;closeM();view('dev');refresh()}catch(e){unitMsg.textContent=e.message}}
function renderMap(players){let all=[me,...players];map.innerHTML='';for(let i=0;i<100;i++){let p=all.find(x=>x.cell===i),c=document.createElement('div');c.className='cell '+(p?.id===me.id?'me':p?'other':'');if(p){c.innerHTML=`<img src="images/castle.png"><span class="name">${p.id===me.id?'من':p.name}</span>`;if(p.id!==me.id)c.onclick=()=>selectTarget(p)}map.appendChild(c)}}
function fmt(s){let m=Math.floor(s/60),x=s%60;return(m?m+' دقیقه و ':'')+x+' ثانیه'}async function manageBattle(b){if(b.status!=='traveling')return;try{await api('/api/battle/manage',{method:'POST',body:JSON.stringify({battleId:b.id})});b.status='managed'}catch(e){console.error(e)}}function renderTimer(){let a=battles.filter(b=>b.status==='traveling');if(!a.length){timer.classList.add('hidden');return}let left=Math.max(0,Math.ceil((Math.min(...a.map(b=>b.arrivalAt))-Date.now())/1000));if(left<=0){timer.classList.add('hidden');a.forEach(manageBattle);return}timer.classList.remove('hidden');timer.textContent='⏱ زمان رسیدن نیروها: '+fmt(left)}
async function refresh(){if(!token)return;try{let d=await api('/api/world');me=d.self;battles=d.battles;info.textContent='👤 '+me.name+' | 🏰 سطح '+me.castleLevel;renderMap(d.players);devInfo.textContent='سطح قلعه: '+me.castleLevel;army.innerHTML=types.map(t=>`<div>${labels[t]}: ${me.army[t]}</div>`).join('');renderTimer()}catch(e){console.error(e)}}setInterval(refresh,1000);let saved=localStorage.freshGame;if(saved){token=saved;api('/api/me').then(d=>{me=d.user;auth.classList.add('hidden');game.classList.remove('hidden');refresh()}).catch(()=>localStorage.removeItem('freshGame'))}</script></body></html>
